version: "3.9"

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: ibm-net-neo4j
    ports:
      - "7474:7474"   # HTTP / browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  ollama:
    image: ollama/ollama:latest
    container_name: ibm-net-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
